# Gate scripts, their unit tests, and the kit agent docs are byte-copied
# (packages/gauntlet-gates -> examples/todo and templates/ts-node-web).
# CPD would score that mirror as new-code duplication on every gate change.
# App source under src/ stays in duplication detection.
sonar.cpd.exclusions=examples/todo/scripts/**,examples/todo/tests/**,examples/todo/AGENTS.md,examples/todo/.agent/**,examples/todo/docs/generated/**,examples/todo/.gitignore,templates/ts-node-web/scripts/**,templates/ts-node-web/tests/**,templates/ts-node-web/AGENTS.md,templates/ts-node-web/.agent/**,templates/ts-node-web/docs/generated/**,templates/ts-node-web/.gitignore
