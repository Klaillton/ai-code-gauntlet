name: regen-todo-lock

on:
  push:
    branches: [fix/security-hono-todo-4.13.5]
    paths:
      - "examples/todo/package.json"
      - ".github/workflows/regen-todo-lock.yml"
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-hono-todo-4.13.5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate examples/todo lockfile
        working-directory: examples/todo
        run: |
          rm -f package-lock.json
          npm install
          npm audit fix || true
          node -e "const l=require('./package-lock.json'); const v=l.packages['node_modules/hono'].version; const [maj,min,pat]=v.split('.').map(Number); if (maj!==4 || min<13 || (min===13 && pat<5)) { console.error('hono too old', v); process.exit(1); } console.log('hono', v);"
      - name: Commit and push lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/todo/package-lock.json
          if git diff --staged --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "fix(security): regenerate todo lockfile for hono>=4.13.5"
          git push origin HEAD:fix/security-hono-todo-4.13.5
