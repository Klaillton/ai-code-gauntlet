name: verify

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing at workflow level (githubactions:S8264). Each job sets its own token scope.
permissions: {}

jobs:
  gates-sync:
    name: Gate scripts in sync
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node packages/gauntlet-gates/check.mjs
      - run: node packages/gauntlet-skills/check.mjs
      - run: node --test packages/create-ai-gauntlet/src/cli.test.js

  sbom:
    name: SBOM
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            templates/ts-node-web/package-lock.json
            examples/todo/package-lock.json
      - run: npm --prefix templates/ts-node-web ci
      - run: npm --prefix examples/todo ci
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p sbom
          npm --prefix templates/ts-node-web sbom --sbom-format cyclonedx > sbom/template-cyclonedx.json
          npm --prefix examples/todo sbom --sbom-format cyclonedx > sbom/todo-cyclonedx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  audit:
    name: npm audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            templates/ts-node-web/package-lock.json
            examples/todo/package-lock.json
      - run: npm --prefix templates/ts-node-web ci
      - run: npm --prefix examples/todo ci
      - run: npm --prefix templates/ts-node-web audit --audit-level=critical
      - run: npm --prefix examples/todo audit --audit-level=critical

  smoke-create:
    name: Smoke create + verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Pack create-ai-gauntlet (bundles kit/)
        working-directory: packages/create-ai-gauntlet
        run: npm pack
      - name: Scaffold from the packed tarball
        run: |
          TARBALL=$(ls packages/create-ai-gauntlet/create-ai-gauntlet-*.tgz | head -n 1)
          mkdir -p "$RUNNER_TEMP/from-pack"
          cd "$RUNNER_TEMP/from-pack"
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          npx create-ai-gauntlet create "$RUNNER_TEMP/gauntlet-smoke"
      - name: Install, browsers, verify
        working-directory: ${{ runner.temp }}/gauntlet-smoke
        env:
          CI: true
          GAUNTLET_E2E: "1"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # protect-specs / deps-lock / crap are fail-closed without git
          git init
          git config user.email "ci@gauntlet.local"
          git config user.name "gauntlet-ci"
          git add -A
          git commit -m "smoke scaffold"
          # CHANGE-4: the scaffold is its own repo. Its policy base is its first commit
          # (origin/main via a local bare remote), not the kit's PR/push event context.
          git init --bare -q "$RUNNER_TEMP/gauntlet-smoke-origin.git"
          git remote add origin "$RUNNER_TEMP/gauntlet-smoke-origin.git"
          git push -q origin HEAD:main
          git fetch -q origin main
          env -u GITHUB_BASE_REF -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH npm run verify

  gitleaks:
    name: gitleaks (history extra)
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_checksums.txt"
          curl -sSfL -o "gitleaks_${VER}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          grep "gitleaks_${VER}_linux_x64.tar.gz$" checksums.txt | sha256sum -c
          tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Detect secrets in git history
        run: gitleaks detect --source . --verbose --redact --exit-code 1 --report-path gitleaks-report.json --report-format json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks
          path: gitleaks-report.json
          if-no-files-found: ignore

  template:
    name: Template ts-node-web
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/ts-node-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch main for spec diffs
        run: git fetch --no-tags origin main:refs/remotes/origin/main || git fetch origin main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: templates/ts-node-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CHANGE-4: on push the policy base is github.event.before; the only grant is the
      # human label policy-change-approved on the PR that produced this commit.
      - name: Policy grant from merged PR label (push only)
        id: policy-grant
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(",")' || true)
          case ",$labels," in
            *,policy-change-approved,*) echo "approved=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "approved=" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm run verify
        env:
          CI: true
          GAUNTLET_E2E: "1"
          # PR labels only. Push to main skips origin/main...HEAD inside the diff gates;
          # policy-base (CHANGE-4) diffs github.event.before..HEAD on push.
          ALLOW_SPEC_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'specs-approved') && '1' || '' }}
          ALLOW_DEPS_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'deps-approved') && '1' || '' }}
          HOLES_REVIEW_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'holes-approved') && '1' || '' }}
          SPEC_SYNC_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'spec-sync-approved') && '1' || '' }}
          POLICY_CHANGE_APPROVED: ${{ (contains(github.event.pull_request.labels.*.name, 'policy-change-approved') || steps.policy-grant.outputs.approved == '1') && '1' || '' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gauntlet-template
          path: templates/ts-node-web/gauntlet-report.json
          if-no-files-found: ignore

  example-todo:
    name: Example Todo
    permissions:
      contents: read
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/todo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch main for spec diffs
        run: git fetch --no-tags origin main:refs/remotes/origin/main || git fetch origin main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/todo/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CHANGE-4: on push the policy base is github.event.before; the only grant is the
      # human label policy-change-approved on the PR that produced this commit.
      - name: Policy grant from merged PR label (push only)
        id: policy-grant
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | .labels[].name] | join(",")' || true)
          case ",$labels," in
            *,policy-change-approved,*) echo "approved=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "approved=" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm run verify
        env:
          CI: true
          GAUNTLET_E2E: "1"
          # PR labels only. Push to main skips origin/main...HEAD inside the diff gates;
          # policy-base (CHANGE-4) diffs github.event.before..HEAD on push.
          ALLOW_SPEC_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'specs-approved') && '1' || '' }}
          ALLOW_DEPS_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'deps-approved') && '1' || '' }}
          HOLES_REVIEW_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'holes-approved') && '1' || '' }}
          SPEC_SYNC_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'spec-sync-approved') && '1' || '' }}
          POLICY_CHANGE_APPROVED: ${{ (contains(github.event.pull_request.labels.*.name, 'policy-change-approved') || steps.policy-grant.outputs.approved == '1') && '1' || '' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-todo
          path: examples/todo/coverage/
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gauntlet-todo
          path: |
            examples/todo/gauntlet-report.json
            examples/todo/mutation-report.json
            examples/todo/complexity-report.json
          if-no-files-found: ignore

  # ADD-POLY S1: pinned runner (packages/gauntlet-gates/run.mjs) on the Maven fixtures with
  # JDK 21. The consumer fixtures have no package.json; every negative fixture must go red.
  maven-skeleton:
    name: Maven walking skeleton (JDK 21)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: packages/gauntlet-gates/fixtures/maven/**/pom.xml
      - name: Install Maven 3.9.11 (pinned, sha512-checked)
        run: |
          set -euo pipefail
          VER=3.9.11
          BASE="https://archive.apache.org/dist/maven/maven-3/${VER}/binaries"
          curl --proto '=https' --tlsv1.2 -sSfL -o maven.tgz "${BASE}/apache-maven-${VER}-bin.tar.gz"
          echo "bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978  maven.tgz" | sha512sum -c
          tar -xzf maven.tgz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${VER}/bin" >> "$GITHUB_PATH"
      - run: mvn -v
      - run: npm ci --prefix packages/gauntlet-gates --ignore-scripts --no-audit --no-fund
      # Fixture repos are local git repos; drop the kit's PR context so policy-base uses theirs.
      - run: env -u GITHUB_BASE_REF -u GITHUB_EVENT_NAME -u GITHUB_EVENT_PATH npm --prefix packages/gauntlet-gates test
